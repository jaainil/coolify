# documentation: https://github.com/BlogFactoryHQ/blogfactory/blob/main/docs/self-hosting.md
# slogan: Self-hosted control plane for AI-assisted content operations and human-approved CMS draft delivery.
# category: cms
# tags: blogfactory,blog,content,ai,cms,wordpress,ghost,minio,postgresql,mcp
# logo: svgs/blogfactory.svg
# port: 80

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-blogfactory}
      - POSTGRES_USER=${POSTGRES_USER:-blogfactory}
      - POSTGRES_PASSWORD=$SERVICE_PASSWORD_POSTGRES
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-blogfactory} -d ${POSTGRES_DB:-blogfactory}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - blogfactory-postgres-data:/var/lib/postgresql/data

  minio:
    image: docker.io/pgsty/minio@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    restart: unless-stopped
    command: server /data --console-address :9001
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-blogfactory}
      - MINIO_ROOT_PASSWORD=$SERVICE_PASSWORD_MINIO
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - blogfactory-minio-data:/data

  api:
    image: ghcr.io/blogfactoryhq/blogfactory-api:${BLOGFACTORY_VERSION:-v0.1.0}
    restart: unless-stopped
    command: ["sh", "-c", "bun run src/init-s3-bucket.ts && bun run src/db/migrate.ts && exec bun run src/index.ts"]
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - PORT=3000
      - BLOGFACTORY_SELF_HOSTED=true
      - DATABASE_URL=postgresql://${POSTGRES_USER:-blogfactory}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/${POSTGRES_DB:-blogfactory}
      - JWT_SECRET=$SERVICE_PASSWORD_64_JWT
      - API_KEY_ENCRYPTION_SECRET=$SERVICE_PASSWORD_64_APIKEY
      - ADMIN_EMAILS=${ADMIN_EMAILS:?Set at least one administrator email address}
      - BLOGFACTORY_ALLOW_SIGNUP=${BLOGFACTORY_ALLOW_SIGNUP:-true}
      - CRON_SECRET=$SERVICE_PASSWORD_CRON
      - OPENROUTER_WEBHOOK_SECRET=${OPENROUTER_WEBHOOK_SECRET:-}
      - WEB_APP_URL=${SERVICE_URL_WEB:-http://localhost:8080}
      - MCP_APP_URL=http://web/mcp-review.html
      - MCP_ALLOWED_ORIGINS=${SERVICE_URL_WEB:-http://localhost:8080}
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY_ID=${MINIO_ROOT_USER:-blogfactory}
      - S3_SECRET_ACCESS_KEY=$SERVICE_PASSWORD_MINIO
      - S3_BUCKET=blogfactory
      - S3_REGION=us-east-1
      - GOOGLE_SEARCH_CONSOLE_CLIENT_ID=${GOOGLE_SEARCH_CONSOLE_CLIENT_ID:-}
      - GOOGLE_SEARCH_CONSOLE_CLIENT_SECRET=${GOOGLE_SEARCH_CONSOLE_CLIENT_SECRET:-}
      - GOOGLE_SEARCH_CONSOLE_REDIRECT_URI=${GOOGLE_SEARCH_CONSOLE_REDIRECT_URI:-}
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3000/api/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20

  web:
    image: ghcr.io/blogfactoryhq/blogfactory-web:${BLOGFACTORY_VERSION:-v0.1.0}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      - SERVICE_URL_WEB_80
      - API_UPSTREAM=http://api:3000
    healthcheck:
      test: ["CMD-SHELL", "nginx -t >/dev/null 2>&1 && wget -q -O /dev/null http://api:3000/api/ready"]
      interval: 10s
      timeout: 5s
      retries: 20

  scheduler:
    image: curlimages/curl:8.15.0
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      - CRON_SECRET=$SERVICE_PASSWORD_CRON
      - CRON_INTERVAL_SECONDS=${CRON_INTERVAL_SECONDS:-21600}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        while true; do curl --fail --silent --show-error --output /dev/null -H "Authorization: Bearer $${CRON_SECRET}" http://api:3000/api/cron/drain && echo "Scheduler drain completed"; sleep "$${CRON_INTERVAL_SECONDS}"; done

volumes:
  blogfactory-postgres-data:
  blogfactory-minio-data:
