# documentation: https://answer.apache.org/docs/installation/
# slogan: Open-source Q&A platform for teams and communities.
# category: cms
# tags: answer,apache,qa,forum,knowledge-base,community,questions,helpdesk
# logo: svgs/answer.svg
# port: 80

services:
  answer:
    image: apache/answer:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - SERVICE_URL_ANSWER_80
      - INSTALL_PORT=80
      - AUTO_INSTALL=true
      - DB_TYPE=postgres
      - DB_HOST=postgres:5432
      - DB_USERNAME=$SERVICE_USER_POSTGRES
      - DB_PASSWORD=$SERVICE_PASSWORD_POSTGRES
      - DB_NAME=${POSTGRES_DB:-answer}
      - LANGUAGE=${ANSWER_LANGUAGE:-en-US}
      - SITE_NAME=${ANSWER_SITE_NAME:-Apache Answer}
      - SITE_URL=${SERVICE_URL_ANSWER:-http://localhost:9080}
      - CONTACT_EMAIL=${ANSWER_CONTACT_EMAIL:-admin@example.com}
      - ADMIN_NAME=${ANSWER_ADMIN_NAME:-admin}
      - ADMIN_PASSWORD=$SERVICE_PASSWORD_ADMIN
      - ADMIN_EMAIL=${ANSWER_ADMIN_EMAIL:-admin@example.com}
      - EXTERNAL_CONTENT_DISPLAY=${EXTERNAL_CONTENT_DISPLAY:-ask_before_display}
      - SITE_ADDR=0.0.0.0:80
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - answer-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=$SERVICE_USER_POSTGRES
      - POSTGRES_PASSWORD=$SERVICE_PASSWORD_POSTGRES
      - POSTGRES_DB=${POSTGRES_DB:-answer}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $SERVICE_USER_POSTGRES -d ${POSTGRES_DB:-answer}"]
      interval: 10s
      timeout: 5s
      retries: 6
    volumes:
      - answer-postgres-data:/var/lib/postgresql/data

volumes:
  answer-data:
  answer-postgres-data:
