# documentation: https://formbricks.com/docs/self-hosting/setup/docker
# slogan: Open Source Survey Platform
# category: productivity
# tags: form, builder, forms, survey
# logo: svgs/formbricks.png
# port: 3000

services:
  postgres:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    volumes:
      - formbricks-postgres-data:/var/lib/postgresql
    environment:
      - POSTGRES_PASSWORD=$SERVICE_PASSWORD_POSTGRES
      - POSTGRES_DB=formbricks
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  authzed-db-bootstrap:
    image: pgvector/pgvector:pg18
    restart: "no"
    entrypoint: ["/bin/sh", "/bootstrap.sh"]
    environment:
      - POSTGRES_ADMIN_URL=postgresql://postgres:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/postgres?sslmode=disable
      - AUTHZED_DATABASE_NAME=spicedb
      - AUTHZED_DATABASE_USERNAME=spicedb
      - AUTHZED_DATABASE_PASSWORD=$SERVICE_PASSWORD_AUTHZED
    volumes:
      - type: bind
        source: ./authzed-postgres-bootstrap.sh
        target: /bootstrap.sh
        content: |
          #!/bin/sh

          set -eu

          : "${POSTGRES_ADMIN_URL:?POSTGRES_ADMIN_URL is required}"
          : "${AUTHZED_DATABASE_PASSWORD:?AUTHZED_DATABASE_PASSWORD is required}"

          AUTHZED_DATABASE_NAME="${AUTHZED_DATABASE_NAME:-spicedb}"
          AUTHZED_DATABASE_USERNAME="${AUTHZED_DATABASE_USERNAME:-spicedb}"

          psql "${POSTGRES_ADMIN_URL}" \
            --set=ON_ERROR_STOP=1 \
            --set=database_name="${AUTHZED_DATABASE_NAME}" \
            --set=database_username="${AUTHZED_DATABASE_USERNAME}" \
            --set=database_password="${AUTHZED_DATABASE_PASSWORD}" <<'SQL'
          SELECT format('CREATE ROLE %I LOGIN PASSWORD %L', :'database_username', :'database_password')
          WHERE NOT EXISTS (
            SELECT 1 FROM pg_roles WHERE rolname = :'database_username'
          ) \gexec

          SELECT format('ALTER ROLE %I WITH LOGIN PASSWORD %L', :'database_username', :'database_password') \gexec

          SELECT format('CREATE DATABASE %I OWNER %I', :'database_name', :'database_username')
          WHERE NOT EXISTS (
            SELECT 1 FROM pg_database WHERE datname = :'database_name'
          ) \gexec

          SELECT format('ALTER DATABASE %I OWNER TO %I', :'database_name', :'database_username') \gexec
          SQL

          printf '%s\n' "AuthZed database bootstrap completed."
    depends_on:
      postgres:
        condition: service_healthy

  spicedb-migrate:
    image: authzed/spicedb:v1.57.0
    restart: "no"
    command: datastore migrate head
    environment:
      - SPICEDB_DATASTORE_ENGINE=postgres
      - SPICEDB_DATASTORE_CONN_URI=postgresql://spicedb:${SERVICE_PASSWORD_AUTHZED}@postgres:5432/spicedb?sslmode=disable
    depends_on:
      authzed-db-bootstrap:
        condition: service_completed_successfully

  spicedb:
    image: authzed/spicedb:v1.57.0
    restart: unless-stopped
    command: serve
    mem_limit: 512m
    environment:
      - SPICEDB_DATASTORE_ENGINE=postgres
      - SPICEDB_DATASTORE_CONN_URI=postgresql://spicedb:${SERVICE_PASSWORD_AUTHZED}@postgres:5432/spicedb?sslmode=disable
      - SPICEDB_GRPC_PRESHARED_KEY=$SERVICE_PASSWORD_AUTHZEDTOKEN
      - SPICEDB_LOG_FORMAT=json
      - SPICEDB_LOG_LEVEL=info
      - SPICEDB_TELEMETRY_ENDPOINT=
    depends_on:
      spicedb-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/usr/local/bin/grpc_health_probe", "-addr=localhost:50051"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: valkey/valkey@sha256:418652cfb58ef879d4978c33553735d7147016032d5aefaa14c828e611eb9dfd
    restart: unless-stopped
    command: valkey-server --appendonly yes --maxmemory-policy noeviction
    volumes:
      - formbricks-redis-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  formbricks-migrate:
    image: ghcr.io/formbricks/formbricks:latest
    restart: "no"
    entrypoint: ["sh", "-c"]
    command:
      - "node /home/nextjs/validate-env.mjs && if command -v timeout >/dev/null 2>&1; then timeout 300 node packages/database/dist/scripts/apply-migrations.js; else node packages/database/dist/scripts/apply-migrations.js; fi"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - WEBAPP_URL=${SERVICE_URL_FORMBRICKS:-http://localhost:3000}
      - BETTER_AUTH_URL=${SERVICE_URL_FORMBRICKS:-http://localhost:3000}
      - DATABASE_URL=postgresql://postgres:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/formbricks?schema=public
      - BETTER_AUTH_SECRET=$SERVICE_HEX_64_AUTH
      - ENCRYPTION_KEY=$SERVICE_HEX_64_ENCRYPTION
      - CRON_SECRET=$SERVICE_HEX_64_CRON
      - REDIS_URL=redis://redis:6379
      - HUB_API_KEY=$SERVICE_HEX_64_HUB
      - HUB_API_URL=http://hub:8080
      - CUBEJS_API_URL=http://cube:4000
      - CUBEJS_API_SECRET=$SERVICE_HEX_64_CUBE
      - CUBEJS_JWT_ISSUER=formbricks-web
      - CUBEJS_JWT_AUDIENCE=formbricks-cube
      - AUTHZED_ENABLED=true
      - AUTHZED_ENDPOINT=spicedb:50051
      - AUTHZED_TOKEN=$SERVICE_PASSWORD_AUTHZEDTOKEN
      - AUTHZED_SYSTEM_KEY=formbricks
      - AUTHZED_INSECURE=true
      - AUTHZED_CONSISTENCY=fully_consistent
      - EMAIL_VERIFICATION_DISABLED=1
      - PASSWORD_RESET_DISABLED=1
      - LOG_LEVEL=info

  formbricks:
    image: ghcr.io/formbricks/formbricks:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      cube:
        condition: service_healthy
      formbricks-migrate:
        condition: service_completed_successfully
      authzed-initialize:
        condition: service_completed_successfully
      hub-migrate:
        condition: service_completed_successfully
      hub:
        condition: service_started
    environment:
      - SERVICE_URL_FORMBRICKS_3000
      - WEBAPP_URL=${SERVICE_URL_FORMBRICKS:-http://localhost:3000}
      - BETTER_AUTH_URL=${SERVICE_URL_FORMBRICKS:-http://localhost:3000}
      - DATABASE_URL=postgresql://postgres:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/formbricks?schema=public
      - BETTER_AUTH_SECRET=$SERVICE_HEX_64_AUTH
      - ENCRYPTION_KEY=$SERVICE_HEX_64_ENCRYPTION
      - CRON_SECRET=$SERVICE_HEX_64_CRON
      - REDIS_URL=redis://redis:6379
      - HUB_API_KEY=$SERVICE_HEX_64_HUB
      - HUB_API_URL=http://hub:8080
      - CUBEJS_API_URL=http://cube:4000
      - CUBEJS_API_SECRET=$SERVICE_HEX_64_CUBE
      - CUBEJS_JWT_ISSUER=formbricks-web
      - CUBEJS_JWT_AUDIENCE=formbricks-cube
      - AUTHZED_ENABLED=true
      - AUTHZED_ENDPOINT=spicedb:50051
      - AUTHZED_TOKEN=$SERVICE_PASSWORD_AUTHZEDTOKEN
      - AUTHZED_SYSTEM_KEY=formbricks
      - AUTHZED_INSECURE=true
      - AUTHZED_CONSISTENCY=fully_consistent
      - SKIP_STARTUP_MIGRATION=true
      - EMAIL_VERIFICATION_DISABLED=1
      - PASSWORD_RESET_DISABLED=1
      - LOG_LEVEL=info
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3000"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 60s

  authzed-initialize:
    image: ghcr.io/formbricks/formbricks:latest
    restart: "no"
    entrypoint: ["formbricks-authzed"]
    command: ["upgrade", "prepare"]
    depends_on:
      formbricks-migrate:
        condition: service_completed_successfully
      spicedb:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://postgres:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/formbricks?schema=public
      - ENCRYPTION_KEY=authzed-initialize-unused
      - CUBEJS_API_SECRET=authzed-initialize-unused
      - CUBEJS_API_URL=http://localhost
      - HUB_API_KEY=authzed-initialize-unused
      - HUB_API_URL=http://localhost
      - REDIS_URL=redis://localhost
      - LOG_LEVEL=fatal
      - AUTHZED_ENABLED=true
      - AUTHZED_ENDPOINT=spicedb:50051
      - AUTHZED_TOKEN=$SERVICE_PASSWORD_AUTHZEDTOKEN
      - AUTHZED_SYSTEM_KEY=formbricks
      - AUTHZED_INSECURE=true
      - AUTHZED_CONSISTENCY=fully_consistent

  hub-migrate:
    image: ghcr.io/formbricks/hub:latest
    restart: "no"
    entrypoint: ["sh", "-c"]
    command:
      - 'if [ -x /usr/local/bin/goose ] && [ -x /usr/local/bin/river ]; then /usr/local/bin/goose -dir /app/migrations postgres "$$DATABASE_URL" up && /usr/local/bin/river migrate-up --database-url "$$DATABASE_URL"; else echo "Migration tools (goose/river) not in image."; exit 1; fi'
    depends_on:
      formbricks-migrate:
        condition: service_completed_successfully
    environment:
      - DATABASE_URL=postgresql://postgres:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/formbricks?sslmode=disable

  hub:
    image: ghcr.io/formbricks/hub:latest
    restart: unless-stopped
    depends_on:
      hub-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://postgres:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/formbricks?sslmode=disable
      - TAXONOMY_SERVICE_URL=
      - TAXONOMY_SERVICE_TOKEN=
      - HUB_INTERNAL_API_TOKEN=
      - API_KEY=$SERVICE_HEX_64_HUB

  hub-worker:
    image: ghcr.io/formbricks/hub:latest
    restart: unless-stopped
    entrypoint: ["/app/hub-worker"]
    depends_on:
      hub-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      disable: true
    environment:
      - DATABASE_URL=postgresql://postgres:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/formbricks?sslmode=disable
      - TAXONOMY_SERVICE_URL=
      - TAXONOMY_SERVICE_TOKEN=
      - HUB_INTERNAL_API_TOKEN=

  cube-config:
    image: curlimages/curl:8.15.0
    restart: "no"
    entrypoint: ["sh", "-c"]
    command:
      - |
        mkdir -p /config/model
        curl -fsSL https://raw.githubusercontent.com/formbricks/formbricks/main/docker/cube/cube.js -o /config/cube.js
        curl -fsSL https://raw.githubusercontent.com/formbricks/formbricks/main/docker/cube/schema/FeedbackRecords.js -o /config/model/FeedbackRecords.js
    volumes:
      - formbricks-cube-config:/config

  cube:
    image: ghcr.io/formbricks/cube:1.8.8-2
    restart: unless-stopped
    depends_on:
      cube-config:
        condition: service_completed_successfully
      hub-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      - CUBEJS_DB_TYPE=postgres
      - CUBEJS_DB_HOST=postgres
      - CUBEJS_DB_NAME=formbricks
      - CUBEJS_DB_USER=postgres
      - CUBEJS_DB_PASS=$SERVICE_PASSWORD_POSTGRES
      - CUBEJS_DB_PORT=5432
      - CUBEJS_API_SECRET=$SERVICE_HEX_64_CUBE
      - CUBEJS_JWT_ISSUER=formbricks-web
      - CUBEJS_JWT_AUDIENCE=formbricks-cube
      - CUBEJS_DEFAULT_API_SCOPES=meta,data
      - CUBEJS_EXTERNAL_DEFAULT=false
      - CUBEJS_CACHE_AND_QUEUE_DRIVER=memory
    volumes:
      - formbricks-cube-config:/cube/conf:ro
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:4000/readyz', (res) => { res.resume(); process.exit(res.statusCode === 200 ? 0 : 1); }).on('error', () => process.exit(1));",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  formbricks-postgres-data:
  formbricks-redis-data:
  formbricks-cube-config:
